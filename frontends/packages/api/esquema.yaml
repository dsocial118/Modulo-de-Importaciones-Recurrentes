openapi: 3.0.3
info:
  title: MIR — API del front v2
  version: 0.1.0
paths:
  /api/mir/carga/:
    get:
      operationId: mir_carga_retrieve
      description: Los archivos del período, con su estado y lo que necesita cada
        uno.
      tags:
      - mir
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Carga'
          description: ''
  /api/mir/carga/{codigo}/:
    post:
      operationId: mir_carga_create
      description: Sube UN archivo, declarado por quien carga.
      parameters:
      - in: path
        name: codigo
        schema:
          type: string
        required: true
      tags:
      - mir
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                archivo:
                  type: string
                  format: binary
                periodo:
                  type: string
                jurisdiccion:
                  type: string
              required:
              - archivo
              - periodo
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoDeImportar'
          description: ''
  /api/mir/importaciones/{importacion_id}/:
    get:
      operationId: mir_importaciones_retrieve
      description: 'Lo que pasó con una importación: problemas del archivo y hallazgos.'
      parameters:
      - in: path
        name: importacion_id
        schema:
          type: integer
        required: true
      tags:
      - mir
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detalle'
          description: ''
  /api/mir/importaciones/{importacion_id}/datos/:
    get:
      operationId: mir_importaciones_datos_retrieve
      description: Los datos importados de una hoja, para revisar y corregir.
      parameters:
      - in: query
        name: hoja
        schema:
          type: integer
      - in: path
        name: importacion_id
        schema:
          type: integer
        required: true
      - in: query
        name: pagina
        schema:
          type: integer
      - in: query
        name: solo
        schema:
          type: string
        description: '«avisos»: sólo las filas con advertencia'
      tags:
      - mir
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Datos'
          description: ''
    post:
      operationId: mir_importaciones_datos_create
      description: Los datos importados de una hoja, para revisar y corregir.
      parameters:
      - in: path
        name: importacion_id
        schema:
          type: integer
        required: true
      tags:
      - mir
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Correccion'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Correccion'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Correccion'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorreccionHecha'
          description: ''
  /api/mir/importaciones/{importacion_id}/errores.xlsx:
    get:
      operationId: mir_importaciones_errores.xlsx_retrieve
      description: Un Excel con los errores, una hoja por cada hoja del archivo.
      parameters:
      - in: path
        name: importacion_id
        schema:
          type: integer
        required: true
      tags:
      - mir
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
          description: ''
  /api/mir/importaciones/{importacion_id}/hallazgos/:
    get:
      operationId: mir_importaciones_hallazgos_retrieve
      description: Los hallazgos de una importación, filtrados y paginados.
      parameters:
      - in: query
        name: buscar
        schema:
          type: string
      - in: query
        name: hoja
        schema:
          type: string
      - in: path
        name: importacion_id
        schema:
          type: integer
        required: true
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: page_size
        schema:
          type: integer
      - in: query
        name: severidad
        schema:
          type: string
      tags:
      - mir
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaDeHallazgos'
          description: ''
  /api/mir/importaciones/{importacion_id}/marcado.xlsx:
    get:
      operationId: mir_importaciones_marcado.xlsx_retrieve
      description: El archivo que subió la jurisdicción, con las celdas marcadas.
      parameters:
      - in: path
        name: importacion_id
        schema:
          type: integer
        required: true
      tags:
      - mir
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
          description: ''
  /api/mir/inicio/:
    get:
      operationId: mir_inicio_retrieve
      description: El período, y cómo viene la presentación de la jurisdicción.
      tags:
      - mir
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inicio'
          description: ''
  /api/mir/observaciones/{observacion_id}/respuesta/:
    post:
      operationId: mir_observaciones_respuesta_create
      description: La jurisdicción responde una observación.
      parameters:
      - in: path
        name: observacion_id
        schema:
          type: integer
        required: true
      tags:
      - mir
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Respuesta'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Respuesta'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Respuesta'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensaje'
          description: ''
  /api/mir/periodos/{codigo}/estado/:
    post:
      operationId: mir_periodos_estado_create
      description: Abre, cierra o vuelve a preparar un período. Lo decide el nivel
        nacional.
      parameters:
      - in: path
        name: codigo
        schema:
          type: string
        required: true
      tags:
      - mir
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstadoDelPeriodo'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EstadoDelPeriodo'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EstadoDelPeriodo'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeriodoCambiado'
          description: ''
  /api/mir/plantillas/:
    get:
      operationId: mir_plantillas_retrieve
      tags:
      - mir
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plantillas'
          description: ''
  /api/mir/plantillas/{periodo}/{codigo}/:
    get:
      operationId: mir_plantilla_descargar
      description: Una plantilla, generada en el momento contra la definición vigente.
      parameters:
      - in: path
        name: codigo
        schema:
          type: string
        required: true
      - in: path
        name: periodo
        schema:
          type: string
        required: true
      tags:
      - mir
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
          description: ''
  /api/mir/plantillas/{periodo}/todas/:
    get:
      operationId: mir_plantillas_todas_retrieve
      description: Todas las plantillas del período en un solo zip.
      parameters:
      - in: path
        name: periodo
        schema:
          type: string
        required: true
      tags:
      - mir
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/zip:
              schema:
                type: string
                format: binary
          description: ''
  /api/mir/presentaciones/{presentacion_id}/acciones/{accion}/:
    post:
      operationId: mir_presentaciones_acciones_create
      description: Ejecuta una transición del circuito sobre una presentación.
      parameters:
      - in: path
        name: accion
        schema:
          type: string
        required: true
      - in: path
        name: presentacion_id
        schema:
          type: integer
        required: true
      tags:
      - mir
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccionHecha'
          description: ''
  /api/mir/presentaciones/{presentacion_id}/comprobante/:
    get:
      operationId: mir_presentaciones_comprobante_retrieve
      description: 'El comprobante de presentación: constancia de la entrega.'
      parameters:
      - in: path
        name: presentacion_id
        schema:
          type: integer
        required: true
      tags:
      - mir
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comprobante'
          description: ''
  /api/mir/presentaciones/{presentacion_id}/expediente/:
    post:
      operationId: mir_presentaciones_expediente_create
      description: Registra el número GDE, después de remitir el comprobante.
      parameters:
      - in: path
        name: presentacion_id
        schema:
          type: integer
        required: true
      tags:
      - mir
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Expediente'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Expediente'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Expediente'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensaje'
          description: ''
  /api/mir/presentaciones/{presentacion_id}/observaciones/:
    post:
      operationId: mir_presentaciones_observaciones_create
      description: El revisor nacional formula una observación. No modifica el dato.
      parameters:
      - in: path
        name: presentacion_id
        schema:
          type: integer
        required: true
      tags:
      - mir
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevaObservacion'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NuevaObservacion'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NuevaObservacion'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensaje'
          description: ''
  /api/mir/pruebas/armar-demo/:
    post:
      operationId: mir_pruebas_armar_demo_create
      description: 'Herramienta de prueba: deja una presentación completa para mostrar.'
      tags:
      - mir
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensaje'
          description: ''
  /api/mir/pruebas/borrar-importaciones/:
    post:
      operationId: mir_pruebas_borrar_importaciones_create
      description: 'Herramienta de prueba: deja el sistema sin ninguna importación.'
      tags:
      - mir
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensaje'
          description: ''
  /api/mir/reglas/:
    get:
      operationId: mir_reglas_retrieve
      description: |-
        Qué se espera en cada columna de una hoja, y —antes de abrir el período—
        los cambios del administrador.
      parameters:
      - in: query
        name: hoja
        schema:
          type: string
      tags:
      - mir
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reglas'
          description: ''
    post:
      operationId: mir_reglas_create
      description: |-
        Qué se espera en cada columna de una hoja, y —antes de abrir el período—
        los cambios del administrador.
      tags:
      - mir
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambiosDeReglas'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CambiosDeReglas'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CambiosDeReglas'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReglasGuardadas'
          description: ''
  /api/mir/resultado/:
    get:
      operationId: mir_resultado_retrieve
      description: 'El estado del período: qué entró, qué observó Nación y qué falta.'
      tags:
      - mir
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resultado'
          description: ''
  /api/mir/revision/:
    get:
      operationId: mir_revision_retrieve
      description: 'Bandeja del revisor técnico nacional: qué presentó cada jurisdicción.'
      tags:
      - mir
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Revision'
          description: ''
  /api/mir/sesion/:
    get:
      operationId: mir_sesion_retrieve
      description: 'Quién está conectado y qué puede hacer: lo primero que pide el
        front.'
      tags:
      - mir
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sesion'
          description: ''
components:
  schemas:
    Accion:
      type: object
      properties:
        accion:
          type: string
        etiqueta:
          type: string
        ayuda:
          type: string
      required:
      - accion
      - ayuda
      - etiqueta
    AccionHecha:
      type: object
      properties:
        estado:
          type: string
        estado_legible:
          type: string
        mensaje:
          type: string
      required:
      - estado
      - estado_legible
      - mensaje
    ArchivoACargar:
      type: object
      properties:
        codigo:
          type: string
        nombre:
          type: string
        obligatorio:
          type: boolean
        estado:
          type: string
        importada:
          type: boolean
        filas:
          type: integer
          nullable: true
        necesita:
          type: array
          items:
            type: string
        bloqueado_por:
          type: array
          items:
            type: string
        nombre_sugerido:
          type: string
      required:
      - bloqueado_por
      - codigo
      - estado
      - filas
      - importada
      - necesita
      - nombre
      - nombre_sugerido
      - obligatorio
    ArchivoDelComprobante:
      type: object
      properties:
        codigo:
          type: string
        nombre_archivo:
          type: string
          nullable: true
        filas_incorporadas:
          type: integer
          nullable: true
        iniciada_el:
          type: string
          format: date-time
          nullable: true
      required:
      - codigo
      - filas_incorporadas
      - iniciada_el
      - nombre_archivo
    ArchivoDelPeriodo:
      type: object
      properties:
        codigo:
          type: string
        nombre:
          type: string
        obligatorio:
          type: boolean
        campos:
          type: integer
        reglas:
          type: integer
        estado:
          type: string
        filas:
          type: integer
          nullable: true
        bloqueantes:
          type: integer
        advertencias:
          type: integer
      required:
      - advertencias
      - bloqueantes
      - campos
      - codigo
      - estado
      - filas
      - nombre
      - obligatorio
      - reglas
    ArchivoDelResultado:
      type: object
      properties:
        codigo:
          type: string
        nombre:
          type: string
        estado:
          type: string
        importada:
          type: boolean
        importacion:
          allOf:
          - $ref: '#/components/schemas/ImportacionBreve'
          nullable: true
        resumen:
          type: array
          items:
            $ref: '#/components/schemas/HallazgoResumido'
      required:
      - codigo
      - estado
      - importacion
      - importada
      - nombre
      - resumen
    Avance:
      type: object
      properties:
        cargados:
          type: integer
        total:
          type: integer
      required:
      - cargados
      - total
    AvisoDeFila:
      type: object
      properties:
        nombre_campo:
          type: string
          nullable: true
        severidad:
          type: string
        descripcion:
          type: string
          nullable: true
      required:
      - descripcion
      - nombre_campo
      - severidad
    Cambio:
      type: object
      properties:
        numero_fila:
          type: integer
          nullable: true
        documento:
          type: string
        campo:
          type: string
          nullable: true
        valor_anterior:
          type: string
          nullable: true
        valor_nuevo:
          type: string
          nullable: true
        motivo:
          type: string
          nullable: true
        usuario:
          type: string
          nullable: true
        fecha:
          type: string
          format: date-time
          nullable: true
      required:
      - campo
      - documento
      - fecha
      - motivo
      - numero_fila
      - usuario
      - valor_anterior
      - valor_nuevo
    CambioDeCampo:
      type: object
      properties:
        campo_id:
          type: integer
        obligatorio:
          type: boolean
        advierte:
          type: array
          items:
            type: string
          maxItems: 2
          minItems: 2
        bloquea:
          type: array
          items:
            type: string
          maxItems: 2
          minItems: 2
      required:
      - campo_id
    CambiosDeReglas:
      type: object
      properties:
        cambios:
          type: array
          items:
            $ref: '#/components/schemas/CambioDeCampo'
        severidades:
          type: array
          items:
            $ref: '#/components/schemas/SeveridadNueva'
    CampoDeReglas:
      type: object
      properties:
        id:
          type: integer
        letra:
          type: string
        titulo:
          type: string
        nombre:
          type: string
        ayuda:
          type: string
        obligatorio:
          type: boolean
        condicionado:
          type: boolean
        numerico:
          type: boolean
        valores:
          $ref: '#/components/schemas/ValoresAdmitidos'
        rangos:
          $ref: '#/components/schemas/Rangos'
        otras:
          type: array
          items:
            $ref: '#/components/schemas/Condicion'
      required:
      - ayuda
      - condicionado
      - id
      - letra
      - nombre
      - numerico
      - obligatorio
      - otras
      - rangos
      - titulo
      - valores
    Carga:
      type: object
      properties:
        periodos:
          type: array
          items:
            $ref: '#/components/schemas/Periodo'
        periodo:
          allOf:
          - $ref: '#/components/schemas/Periodo'
          nullable: true
        jurisdiccion:
          type: string
          nullable: true
        jurisdicciones:
          type: array
          items:
            type: string
        estado_legible:
          type: string
        carga_abierta:
          type: boolean
        puede_cargar:
          type: boolean
        listo:
          type: boolean
        archivos:
          type: array
          items:
            $ref: '#/components/schemas/ArchivoACargar'
      required:
      - archivos
      - carga_abierta
      - estado_legible
      - jurisdiccion
      - jurisdicciones
      - listo
      - periodo
      - periodos
      - puede_cargar
    Celda:
      type: object
      properties:
        nombre:
          type: string
        titulo:
          type: string
        obligatorio:
          type: boolean
        tipo_dato:
          type: string
          nullable: true
        valor:
          type: string
        opciones:
          type: array
          items:
            type: string
        tiene_aviso:
          type: boolean
      required:
      - nombre
      - obligatorio
      - opciones
      - tiene_aviso
      - tipo_dato
      - titulo
      - valor
    Comprobante:
      type: object
      properties:
        id:
          type: integer
        version:
          type: integer
          nullable: true
        estado:
          type: string
        presentada_el:
          type: string
          format: date-time
          nullable: true
        usuario_presenta:
          type: string
          nullable: true
        expediente:
          type: string
          nullable: true
        jurisdiccion:
          type: string
        periodo:
          type: string
        fecha_desde:
          type: string
          format: date
        fecha_hasta:
          type: string
          format: date
        archivos:
          type: array
          items:
            $ref: '#/components/schemas/ArchivoDelComprobante'
      required:
      - archivos
      - estado
      - expediente
      - fecha_desde
      - fecha_hasta
      - id
      - jurisdiccion
      - periodo
      - presentada_el
      - usuario_presenta
      - version
    Condicion:
      type: object
      properties:
        aplicacion_id:
          type: integer
        severidad:
          type: string
        texto:
          type: string
      required:
      - aplicacion_id
      - severidad
      - texto
    ContextoDeEdicion:
      type: object
      properties:
        id:
          type: integer
        archivo_codigo:
          type: string
        jurisdiccion:
          type: string
        periodo:
          type: string
        version:
          type: integer
        estado_presentacion:
          type: string
        estado_legible:
          type: string
        editable:
          type: boolean
      required:
      - archivo_codigo
      - editable
      - estado_legible
      - estado_presentacion
      - id
      - jurisdiccion
      - periodo
      - version
    Correccion:
      type: object
      description: Lo que se manda para corregir un dato.
      properties:
        hoja_id:
          type: integer
        numero_fila:
          type: integer
        campo:
          type: string
        valor:
          type: string
        motivo:
          type: string
          default: ''
      required:
      - campo
      - hoja_id
      - numero_fila
      - valor
    CorreccionHecha:
      type: object
      properties:
        sin_cambios:
          type: boolean
        valor:
          type: string
