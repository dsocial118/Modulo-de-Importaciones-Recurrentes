# MIR — Módulo de Importaciones Recurrentes
# Implementación: RUNAC
#
#   bash entorno/preparar.sh      la primera vez: levanta y arma la base
#   docker compose up -d          después, sólo levantar
#   http://localhost:8100
#
# Autosuficiente: levanta la base y la aplicación. No depende de ninguna red ni
# de ninguna carpeta que esté fuera del repositorio.

services:
  mysql:
    image: mysql:8.4
    # No es opcional. Sin esto los acentos entran mal y «Sí» queda como «SÃ­»,
    # y no se nota hasta mucho después.
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD:-runac_local}
      MYSQL_DATABASE: ${DATABASE_NAME:-runac}
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - datos_mysql:/var/lib/mysql
    ports:
      # Expuesto sólo para poder mirar la base con un cliente: la aplicación no
      # lo usa, se conecta por la red interna al 3306.
      #
      # Si el 3399 ya está ocupado en la máquina, el contenedor no levanta. Se
      # cambia sin tocar este archivo:  PUERTO_BASE=3400 docker compose up -d
      - "${PUERTO_BASE:-3399}:3306"
    healthcheck:
      # Por TCP, no por el socket: el socket tambien responde mientras la base
      # se esta inicializando, y sirve para conectarse a un servidor que
      # todavia no es el definitivo.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DATABASE_PASSWORD:-runac_local}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  web:
    build: .
    depends_on:
      mysql:
        # El web no puede arrancar antes que la base. Es la falla más frecuente
        # al reiniciar la máquina: el contenedor queda levantado contra una base
        # que todavía no existe y no responde nada.
        condition: service_healthy
    volumes:
      - .:/app
      # Reemplaza el montaje de la carpeta hermana que había antes. Las
      # plantillas se sirven desde acá: `RUNAC_PLANTILLAS` resuelve a
      # `/trabajo/capa1/plantillas`, que es `entorno/plantillas`.
      - ./entorno:/trabajo/capa1:ro
    ports:
      # Igual que el de la base:  PUERTO_WEB=8200 docker compose up -d
      - "${PUERTO_WEB:-8100}:8000"
    environment:
      DJANGO_DEBUG: "1"
      DATABASE_HOST: mysql
      DATABASE_PORT: "3306"
      DATABASE_NAME: ${DATABASE_NAME:-runac}
      DATABASE_USER: root
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-runac_local}
      TZ: America/Argentina/Buenos_Aires
      # Adónde reenvía Django lo que llega a /v2/mir/.
      FRONT_MIR_URL: http://front_mir:5173
    healthcheck:
      # /salud/ no toca la base: dice sólo si Django atiende.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/salud/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # Front v2 (React). Se entra por Django, en http://localhost:8100/v2/mir/.
  #
  # Por defecto, la versión compilada servida por nginx: es la que corresponde
  # para quien instala y para mostrar. Para programar con recarga en caliente,
  # FRONT_ETAPA=dev —por ejemplo en un .env propio—. Ver docs/mir/front-v2.md.
  front_mir:
    build:
      context: ./frontends
      target: ${FRONT_ETAPA:-prod}
      args:
        APP: mir
    depends_on:
      web:
        condition: service_healthy
    # El código montado y el puerto propio sólo los usa la etapa dev, para la
    # recarga en caliente. La compilada no los lee.
    volumes:
      - ./frontends:/frontends
      # Las dependencias quedan en el contenedor: las de Linux no sirven en
      # Windows, y al revés.
      - front_node_modules:/frontends/node_modules
    ports:
      - "${PUERTO_FRONT:-5173}:5173"
    environment:
      VITE_HMR_PUERTO: ${PUERTO_FRONT:-5173}
      # Docker Desktop en Windows no avisa los cambios de archivo al contenedor.
      VITE_SONDEO: "1"
    restart: unless-stopped

volumes:
  datos_mysql:
  front_node_modules:
