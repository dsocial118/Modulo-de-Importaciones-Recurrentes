# Prototipo de RUNAC — fuera del repositorio de SISOC.
#
#   docker compose -p runac-proto up -d
#   http://localhost:8100
#
# Usa la misma base que el modelo de datos (contenedor runac_c1_mysql), asi el
# prototipo trabaja sobre las tres capas ya cargadas.

services:
  web:
    build: .
    container_name: runac_proto_web
    volumes:
      - .:/app
      - ../analisis_datos/ModeloMySql/capa1:/trabajo/capa1
      - ../Insumos:/trabajo/insumos:ro
    ports:
      - "8100:8000"
    environment:
      DJANGO_DEBUG: "1"
      DATABASE_HOST: mysql
      DATABASE_PORT: "3306"
      DATABASE_NAME: runac
      DATABASE_USER: root
      DATABASE_PASSWORD: runac_local
      TZ: America/Argentina/Buenos_Aires
    networks:
      - runac
    restart: unless-stopped

networks:
  runac:
    external: true
    name: runac-c1_default
