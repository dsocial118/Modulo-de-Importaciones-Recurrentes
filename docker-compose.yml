# Prototipo de RUNAC — fuera del repositorio de SISOC.
#
#   docker compose -p runac-proto up -d
#   http://localhost:8100   estructura vigente  (base `runac`)
#   http://localhost:8101   estructura nueva    (base `runac_v2`)
#
# Usa la misma base que el modelo de datos (contenedor runac_c1_mysql), asi el
# prototipo trabaja sobre las tres capas ya cargadas.
#
# Son DOS contenedores con el MISMO codigo y bases distintas. La razon de que
# sean dos bases y no dos periodos dentro de una: los catalogos se comparten
# entre versiones de estructura —el de provincias lo usan campos de las dos—,
# asi que probar la estructura nueva en la base de la demo la contamina.
#
# `:8100` es la foto que se muestra y no se toca. `:8101` es el banco de
# pruebas: si se rompe, se borra `runac_v2` y se vuelve a copiar de `runac`.
#
#   Levantar solo el de pruebas, sin tocar el otro:
#     docker compose -p runac-proto up -d web_v2

services:
  web:
    build: .
    container_name: runac_proto_web
    volumes:
      - .:/app
      - ../analisis_datos/ModeloMySql/capa1:/trabajo/capa1
      - ../Insumos:/trabajo/insumos:ro
    ports:
      - "8100:8000"
    environment:
      DJANGO_DEBUG: "1"
      DATABASE_HOST: mysql
      DATABASE_PORT: "3306"
      DATABASE_NAME: runac
      DATABASE_USER: root
      DATABASE_PASSWORD: runac_local
      TZ: America/Argentina/Buenos_Aires
    networks:
      - runac
    restart: unless-stopped

  # El banco de pruebas. Mismo codigo, base distinta: monta la misma carpeta,
  # asi lo que se escribe se ve en los dos y no hay una copia del prototipo que
  # se desincronice.
  #
  # `restart: "no"` a proposito, al reves que el de arriba: si este se cae, se
  # queda caido y se nota. El que tiene que volver solo es el de la demo.
  web_v2:
    build: .
    container_name: runac_proto_web_v2
    volumes:
      - .:/app
      - ../analisis_datos/ModeloMySql/capa1:/trabajo/capa1
      - ../Insumos:/trabajo/insumos:ro
    ports:
      - "8101:8000"
    environment:
      DJANGO_DEBUG: "1"
      DATABASE_HOST: mysql
      DATABASE_PORT: "3306"
      DATABASE_NAME: runac_v2
      DATABASE_USER: root
      DATABASE_PASSWORD: runac_local
      TZ: America/Argentina/Buenos_Aires
    networks:
      - runac
    restart: "no"

networks:
  runac:
    external: true
    name: runac-c1_default
